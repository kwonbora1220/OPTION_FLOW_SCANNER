name: OPTION FLOW SCANNER V2

on:
  workflow_dispatch:

  schedule:
    # 한국시간 기준 매일 오후 11시
    # GitHub Actions는 UTC 기준
    - cron: "0 14 * * 1-5"

jobs:
  scanner:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:

      # --------------------------------------------------
      # 1. Repository
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Python
      # --------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # --------------------------------------------------
      # 3. Install packages
      # --------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --------------------------------------------------
      # 4. Run Scanner 2
      # --------------------------------------------------

      - name: Run Option Flow Scanner V2
        working-directory: "02_PROGRAM"
        run: |
          python option_flow_scanner_v2.py

      # --------------------------------------------------
      # 5. Save generated CSV back to GitHub
      # --------------------------------------------------

      - name: Commit scanner results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add 03_RESULTS/

          git diff --cached --quiet || git commit -m "Update Scanner 2 results"

          git push
