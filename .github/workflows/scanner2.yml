name: OPTION FLOW SCANNER V2

on:
  workflow_dispatch:

  schedule:
    - cron: "00 21 * * 1-5"

  workflow_dispatch:
jobs:

  scanner2:

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create scanner2 universe
        run: |
          python scanner2/auto_universe.py

      - name: Run Scanner 2
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scanner2/option_flow_scanner_v2.py

      - name: Upload scanner results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner2-results
          path: |
            03_RESULTS/daily/
            01_DATA/market/
          if-no-files-found: ignore
