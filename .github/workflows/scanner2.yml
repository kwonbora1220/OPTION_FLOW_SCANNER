name: OPTION FLOW SCANNER 2

on:
  # 매일 자동 실행
  schedule:
    # 한국시간 매일 오후 11시
    # UTC 기준 14:00
    - cron: "0 14 * * *"

  # GitHub Actions 화면에서 수동 실행
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scanner2:
    runs-on: ubuntu-latest

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:

      # ======================================================
      # 1. GitHub 저장소 가져오기
      # ======================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ======================================================
      # 2. Python 설치
      # ======================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ======================================================
      # 3. Python 패키지 설치
      # ======================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance

      # ======================================================
      # 4. 폴더 확인
      # ======================================================
      - name: Check Scanner 2 files
        run: |
          echo "=========================================="
          echo "OPTION FLOW SCANNER 2"
          echo "=========================================="

          echo ""
          echo "[02_PROGRAM]"
          ls -la "02_PROGRAM"

          echo ""
          echo "[01_DATA]"
          ls -la "01_DATA" || true

          echo ""
          echo "[03_RESULTS]"
          ls -la "03_RESULTS" || true

      # ======================================================
      # 5. Telegram Secret 확인
      # ======================================================
      - name: Check Telegram settings
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "ERROR: TELEGRAM_BOT_TOKEN is not set"
            exit 1
          fi

          if [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "ERROR: TELEGRAM_CHAT_ID is not set"
            exit 1
          fi

          echo "Telegram Secrets: OK"

      # ======================================================
      # 6. Universe 생성
      # ======================================================
      - name: Run auto universe
        run: |
          python "02_PROGRAM/auto_universe.py"

      # ======================================================
      # 7. OPTION FLOW SCANNER V2 실행
      # ======================================================
      - name: Run Scanner 2
        run: |
          python "02_PROGRAM/option_flow_scanner_v2.py"

      # ======================================================
      # 8. 결과 확인
      # ======================================================
      - name: Check results
        if: always()
        run: |
          echo "=========================================="
          echo "SCANNER 2 RESULT"
          echo "=========================================="

          if [ -d "03_RESULTS/daily" ]; then
            ls -lah "03_RESULTS/daily"
          else
            echo "03_RESULTS/daily directory not found"
          fi

      # ======================================================
      # 9. 결과 CSV GitHub 저장
      # ======================================================
      - name: Commit results
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "03_RESULTS/daily" || true

          git diff --cached --quiet || git commit -m "Update Scanner 2 results"

          git push || true
